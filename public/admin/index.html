<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Content Manager</title>
</head>
<body>
  <!-- Include the script that builds the page and powers Decap CMS -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    // Configure Decap CMS with GitHub authentication
    window.CMS_MANUAL_INIT = true;
    
    // Initialize CMS when page loads
    document.addEventListener('DOMContentLoaded', function() {
      try {
        // Initialize Decap CMS with GitHub backend
        window.CMS.init({
          config: {
            load_config_file: true
          }
        });

        // Handle authentication errors
        window.CMS.registerEventListener({
          name: 'login',
          handler: ({ author }) => {
            console.log('Successfully logged in as:', author.name);
          }
        });

      } catch (error) {
        console.error("CMS initialization error:", error);
        alert("CMS failed to initialize. Please check your configuration and try again.");
      }
    });
  </script>
</body>
</html>
